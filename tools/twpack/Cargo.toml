[package]
name = "twpack"
version = "0.1.0"
edition = "2021"
description = "Total War pack tool for macOS (Attila), built on rpfm_lib"
license = "MIT"

[dependencies]
rpfm_lib = { git = "https://github.com/Frodo45127/rpfm.git", tag = "v5.1.1" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
xz2 = "0.1"
