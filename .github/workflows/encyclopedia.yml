# Publishes encyclopedia/ (the Fireforged encyclopedia, generated by tools/encyclopedia/build.py and committed) to
# GitHub Pages: https://rfuzzo.github.io/attila-mods/. Needs Settings → Pages → Source: GitHub Actions.
name: Encyclopedia

on:
  push:
    branches: [main]
    paths: ["encyclopedia/**", ".github/workflows/encyclopedia.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: encyclopedia
      - id: deployment
        uses: actions/deploy-pages@v4
